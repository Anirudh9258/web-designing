<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>School Result Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        table caption {
            font-size: 22px;
            font-weight: bold;
            padding: 12px;
            color: #333;
        }
        table th, table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        table th {
            background: #4CAF50;
            color: white;
        }
        table tr:nth-child(even) {
            background: #f9f9f9;
        }
    </style>
</head>
<body>

<table>
    <caption>School Examination Result – 2024</caption>

    <tr>
        <th>Roll No.</th>
        <th>Student Name</th>
        <th>Class</th>
        <th>Math</th>
        <th>Science</th>
        <th>English</th>
        <th>Social Studies</th>
        <th>Total</th>
        <th>Percentage</th>
        <th>Grade</th>
    </tr>
    <tr>
        <td>01</td>
        <td>Student A</td>
        <td>10</td>
        <td>85</td>
        <td>78</td>
        <td>88</td>
        <td>80</td>
        <td>331</td>
        <td>82.75%</td>
        <td>A</td>
    </tr>
    <tr>
        <td>02</td>
        <td>Student B</td>
        <td>10</td>
        <td>72</td>
        <td>69</td>
        <td>75</td>
        <td>70</td>
        <td>286</td>
        <td>71.50%</td>
        <td>B</td>
    </tr>
</table>

</body>
</html>
